      const SVG_NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('chart-1');
      const minX = Math.min(...run.map(point => point[0]));
      const maxX = Math.max(...run.map(point => point[0]));
      const minY = Math.min(...run.map(point => point[1]));
      const maxY = Math.max(...run.map(point => point[1]));
      const maxT = Math.max(...run.map(point => point[2]));

      const scale = 800 / (maxX - minX);
      const scaleTime = maxT / 200;

      svg.setAttribute('viewBox', `${minX - 2} ${minY - 2} ${maxX - minX + 4} ${maxY - minY + 4}`);

      const slider = document.getElementById('slider-1');

      const routePath = document.createElementNS(SVG_NS, 'path');
      routePath.classList.add('route');
      svg.appendChild(routePath);

      function updateRoute() {
        const maxTime = parseInt(slider.value, 10) * scaleTime;
        let coords = '';
        for (let i = 0; i < run.length; i++) {
          if (run[i][2] > maxTime) break;
          const cmd = i === 0 ? 'M' : 'L';
          coords += `${cmd}${run[i][0]},${run[i][1]} `;
        }
        routePath.setAttribute('d', coords);
      }

      slider.addEventListener('input', updateRoute);

    </script>
