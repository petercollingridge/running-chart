      function findExtentOfRun(run) {
        const maxX = Math.max(...run.map(point => point[0]));
        const maxY = Math.max(...run.map(point => point[1]));
        const maxT = Math.max(...run.map(point => point[2]));
        return { maxX, maxY, maxT };
      }

      function findExtentOfRuns(runs) {
        let maxX = 0, maxY = 0, maxT = 0;
        for (const runKey in runs) {
          const run = runs[runKey];
          const extent = findExtentOfRun(run);
          if (extent.maxX > maxX) maxX = extent.maxX;
          if (extent.maxY > maxY) maxY = extent.maxY;
          if (extent.maxT > maxT) maxT = extent.maxT;
        }
        return { maxX, maxY, maxT };
      }

      const { maxX, maxY, maxT } = findExtentOfRuns(runs);
      const scale = 800 / maxX;
      const scaleTime = maxT / 200;
      svg.setAttribute('viewBox', `-2 -2 ${maxX + 4} ${maxY + 4}`);

      const slider = document.getElementById('slider-1');
      const label = document.getElementById('slider-1-label');
      const routes = {};
      const routeMarkers = {};

      function createRoutes(runs) {
        for (const runKey in runs) {
          // Create path element for route
          const routePath = document.createElementNS(SVG_NS, 'path');
          routePath.classList.add('route');
          svg.appendChild(routePath);
          routes[runKey] = routePath;
          // Create circle element for route marker
          const routeMarker = document.createElementNS(SVG_NS, 'circle');
          routeMarker.classList.add('route-marker');
          routeMarker.setAttribute('r', '2');
          svg.appendChild(routeMarker);
          routeMarkers[runKey] = routeMarker;
        }
        return routes;
      }
      createRoutes(runs);

      function updateRoute(runKey, maxTime) {
        const routeData = runs[runKey];
        const routeMarker = routeMarkers[runKey];
        let coords = '';
        for (let i = 0; i < routeData.length; i++) {
          if (routeData[i][2] > maxTime) {
            routeMarker.setAttribute('cx', routeData[i - 1][0]);
            routeMarker.setAttribute('cy', routeData[i - 1][1]);
            break;
          }
          const cmd = i === 0 ? 'M' : 'L';
          coords += `${cmd}${routeData[i][0]},${routeData[i][1]} `;
        }
        routes[runKey].setAttribute('d', coords);
      }

      function getTime(totalSeconds) {
        const seconds = Math.floor(totalSeconds) % 60;
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const hours = Math.floor(totalSeconds / 3600);
        return `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      function updateRoutes() {
        const maxTime = parseInt(slider.value, 10) * scaleTime;
        label.innerHTML = `Time: ${getTime(maxTime)}`;

        for (const runKey in runs) {
          updateRoute(runKey, maxTime);
        }
      }

      slider.addEventListener('input', updateRoutes);

    </script>
</body>
</html>
